[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diophantine-classifier"
version = "0.1.0"
description = "Classify Diophantine equations into named families (Diophantine Library)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "David Roe", email = "roed@mit.edu" }]
requires-python = ">=3.11"
# SageMath is required at runtime but is not pip-installable here: run under
# Sage's Python (sage -python / sage -pip install -e .).
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/DiophantineLibrary/DiophantineClassifier"

[project.scripts]
dioclassify = "diophantine_classifier.cli:main"

[tool.setuptools]
packages = ["diophantine_classifier"]

[tool.setuptools.package-data]
diophantine_classifier = ["data/references.bib", "data/families/*.yaml",
                          "data/families/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
