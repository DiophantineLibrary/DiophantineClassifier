slug: taxicab
name: Equal sums of two cubes
priority: 3
status: solved
class: surface
form: x^3 + y^3 = z^3 + w^3
aliases:
- taxicab numbers
parents:
- equal-sums-like-powers
matcher: false
notes: The equation itself is solved (the surface is rational; Euler's and Binet's
  parametrizations give every rational solution). The taxicab problem proper asks for
  integers with exactly n representations, positive in Ta(n) and signed in Cabtaxi
  numbers; it is open beyond small n.
references:
- key: Silverman1993
  why: the geometry of x^3 + y^3 = k and its rational points
