# Family: Erdos-Straus equation
# Schema: see data/families/README.md; prose documentation in docs/FAMILIES.md.
# References are keys into data/references.bib, each with a 'why' annotation.
slug: erdos-straus
name: Erdos-Straus equation
priority: 1
status: open
class: special
form: 4/n = 1/x + 1/y + 1/z
constraints: n >= 2; x, y, z > 0
parents:
- egyptian-fractions
matcher: true
methods:
- residue-class identities (Mordell; all n outside a few classes mod 840)
- bounded search
- Brauer-Manin obstruction on the associated surfaces
notes: Conjectured solvable for all n >= 2; verified to 10^17; Sierpinski's 5/n
  analogue open.
examples:
- 4/n = 1/x + 1/y + 1/z
references:
- key: ElsholtzTao2013
  why: counting and average results for 4/n = 1/x + 1/y + 1/z
- key: Salez2014
  why: verification up to 10^17
- key: BrightLoughran2020
  why: integral Brauer-Manin obstruction on Erdos-Straus surfaces
