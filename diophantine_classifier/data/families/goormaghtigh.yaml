slug: goormaghtigh
name: Goormaghtigh equation
priority: 3
status: open
class: expdioph
form: (x^m - 1)/(x - 1) = (y^n - 1)/(y - 1)
constraints: y > x >= 2, m > n >= 3
parents:
- polynomial-exponential
matcher: false
notes: 'Known (x, y, m, n): (2, 5, 5, 3) giving 31 and (2, 90, 13, 3) giving 8191;
  finite effective for fixed bases (Balasubramanian-Shorey).'
references:
- key: BalasubramanianShorey1980
  why: effective finiteness for fixed bases
