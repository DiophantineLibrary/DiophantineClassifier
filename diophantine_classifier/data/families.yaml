# Registry of Diophantine equation families for the Diophantine Library.
#
# Source of truth for the classifier: each entry is one family; `parents` edges
# form the specialization DAG (an equation is reported under its most specific
# matching family). `matcher: true` means the classifier implements structural
# recognition for this family in the current wave. Prose documentation with
# fuller references lives in docs/FAMILIES.md — keep the two in sync.
#
# Fields:
#   slug        unique kebab-case identifier
#   name        display name
#   priority    1 = Library launch set, 2 = second wave, 3 = aspirational
#   status      solved | algorithmic | effective | ineffective | partial | open | undecidable
#   class       coarse group (linear/quadratic/genus1/curve/fermat/expdioph/normform/surface/special/boundary)
#   form        standard form (unknowns as displayed; remaining letters are parameters)
#   parents     slugs of immediate generalizations (DAG edges)
#   matcher     whether the classifier recognizes this family structurally
#   code        code templates with {placeholders} filled from match data

- slug: general-polynomial
  name: General polynomial Diophantine equation
  priority: 2
  status: undecidable
  class: boundary
  form: "p(x_1, ..., x_k) = 0"
  parents: []
  matcher: true
  methods: [none in general (MRDP); classification into families]
  notes: >
    Root of the polynomial side of the DAG and the classifier's last-resort
    answer, reported with basic invariants (variables, degree, homogeneity).
  references:
    - "Matiyasevich 1970"

- slug: universal-diophantine
  name: Hilbert's tenth problem exhibits
  priority: 3
  status: undecidable
  class: boundary
  form: "universal/undecidable polynomial families"
  parents: [general-polynomial]
  matcher: false
  notes: >
    Undecidability calibration: 9 unknowns over N (Matiyasevich-Jones), 11 over Z
    (Sun 2021), degree 4 suffices; over Q open; over rings of integers resolved
    2024-25 (Koymans-Pagano; Alpoge-Bhargava-Ho-Shnidman).
  references:
    - "Jones 1982"
    - "Poonen, Notices AMS 2008"

# ---------------------------------------------------------------- linear

- slug: univariate
  name: Univariate polynomial equation
  priority: 1
  status: solved
  class: linear
  form: "f(x) = 0"
  parents: [general-polynomial]
  matcher: true
  methods: [integer root finding via factorization]
  software:
    sage: "f.roots(ZZ)"
  examples: ["x^2 - 5*x + 6 = 0"]

- slug: linear
  name: Linear Diophantine equation
  priority: 1
  status: solved
  class: linear
  form: "a_1*x_1 + ... + a_k*x_k = b"
  parents: [general-polynomial]
  matcher: true
  methods: [extended Euclid, Hermite normal form]
  software:
    sage: "xgcd; matrix(ZZ, A).hermite_form(); solve_diophantine"
    pari: "matsolvemod"
  code:
    sage: |
      # particular solution + lattice of homogeneous solutions
      A = matrix(ZZ, [{coeffs}])
      H, U = A.transpose().hermite_form(transformation=True)
      # solvable iff gcd divides {b}; see DiophantineClassifier solvers.linear
  examples: ["3*x + 5*y = 1"]
  references: ["Niven-Zuckerman-Montgomery ch. 5"]

- slug: linear-system
  name: System of linear equations over ZZ
  priority: 1
  status: solved
  class: linear
  form: "A*x = b"
  parents: [general-polynomial]
  matcher: false   # systems input is wave 2
  methods: [Smith normal form]
  software:
    sage: "A.smith_form(); A.solve_right()"
  references: ["Cohen GTM 138, 2.4"]

- slug: frobenius
  name: Frobenius / numerical semigroup membership
  priority: 2
  status: algorithmic
  class: linear
  form: "a_1*x_1 + ... + a_k*x_k = b, x_i >= 0"
  parents: [linear]
  matcher: false   # positivity constraints are wave 2
  methods: [numerical semigroups, lattice point counting]
  software:
    other: "GAP numericalsgps"
  references: ["Ramirez Alfonsin 2005", "Kannan 1992"]

# ---------------------------------------------------------------- quadratic

- slug: quadric
  name: General quadratic Diophantine equation
  priority: 2
  status: algorithmic
  class: quadratic
  form: "Q(x_1,...,x_k) + L(x_1,...,x_k) + c = 0, k >= 3"
  parents: [general-polynomial]
  matcher: true
  methods: [completing the square, Hasse-Minkowski, Grunewald-Segal]
  software:
    pari: "qfsolve (after reduction)"
  references: ["Grunewald-Segal 1981", "Siegel 1972"]

- slug: binary-quadratic
  name: General binary quadratic equation
  priority: 1
  status: algorithmic
  class: quadratic
  form: "a*x^2 + b*x*y + c*y^2 + d*x + e*y + f = 0"
  parents: [quadric]
  matcher: true
  methods: [completing the square, reduction of binary forms, Pell theory]
  software:
    sage: "solve_diophantine (sympy)"
    pari: "qfbsolve after reduction"
  examples: ["2*x^2 + 3*x*y - 5*y^2 + x - 7 = 0"]
  references: ["Lagrange 1768", "Matthews 2002"]

- slug: binary-qf-representation
  name: Representation by a binary quadratic form
  priority: 1
  status: algorithmic
  class: quadratic
  form: "a*x^2 + b*x*y + c*y^2 = n"
  parents: [binary-quadratic]
  matcher: true
  methods: [reduction theory, Cornacchia, class groups]
  software:
    sage: "BinaryQF([a,b,c]).solve_integer(n)"
    pari: "qfbsolve, qfbcornacchia"
  code:
    sage: "BinaryQF([{a}, {b}, {c}]).solve_integer({n})"
    pari: "qfbsolve(Qfb({a}, {b}, {c}), {n}, 1)"
  examples: ["3*x^2 + 7*y^2 = 19"]
  references: ["Cox, Primes of the form x^2+ny^2"]

- slug: sum-of-two-squares
  name: Sum of two squares
  priority: 1
  status: solved
  class: quadratic
  form: "x^2 + y^2 = n"
  parents: [binary-qf-representation]
  matcher: true
  methods: [Fermat criterion, Cornacchia / Gaussian gcd]
  software:
    sage: "two_squares(n)"
  code:
    sage: "two_squares({n})"
  examples: ["x^2 + y^2 = 610"]
  references: ["Rabin-Shallit 1986"]

- slug: pell-like
  name: Generalized Pell equation
  priority: 1
  status: algorithmic
  class: quadratic
  form: "x^2 - D*y^2 = N"
  parents: [binary-qf-representation]
  matcher: true
  methods: [continued fractions, automorph orbits]
  software:
    pari: "qfbsolve(Qfb(1,0,-D), N, 1)"
    sage: "solve_diophantine"
  code:
    pari: "qfbsolve(Qfb(1, 0, -{D}), {N}, 1)"
  examples: ["x^2 - 61*y^2 = 5"]
  references: ["Matthews 2000", "Mollin"]

- slug: pell
  name: Pell equation
  priority: 1
  status: solved
  class: quadratic
  form: "x^2 - D*y^2 = 1"
  aliases: [Pell-Fermat equation]
  parents: [pell-like]
  matcher: true
  methods: [continued fraction of sqrt(D), fundamental unit]
  software:
    sage: "continued_fraction(sqrt(D)); QuadraticField(D).unit_group()"
    pari: "quadunit(4*D)"
    magma: "FundamentalUnit(QuadraticField(D))"
  code:
    sage: |
      cf = continued_fraction(QuadraticField({D}).gen())
      conv = cf.convergent(len(cf.period()) - 1)
      x1, y1 = conv.numerator(), conv.denominator()
    pari: "quadunit(4*{D})"
  examples: ["x^2 - 61*y^2 = 1", "x^2 - 2*y^2 = -1"]
  references: ["Lenstra, Notices AMS 2002"]

- slug: simultaneous-pell
  name: Simultaneous Pell equations
  priority: 2
  status: effective
  class: quadratic
  form: "x^2 - a*z^2 = 1, y^2 - b*z^2 = 1"
  parents: [pell-like]
  matcher: false   # systems input is wave 2
  methods: [linear forms in logarithms, LLL reduction]
  references: ["Anglin 1996", "Bennett, Crelle 1998"]

- slug: quadratic-form-zero
  name: Isotropy of a quadratic form
  priority: 1
  status: algorithmic
  class: quadratic
  form: "Q(x_1,...,x_k) = 0, k >= 3"
  parents: [quadric]
  matcher: true
  methods: [Hasse-Minkowski, lattice reduction (Simon)]
  software:
    sage: "qfsolve(G)"
    pari: "qfsolve"
    magma: "IsotropicSubspace"
  code:
    sage: |
      from sage.quadratic_forms.qfsolve import qfsolve
      qfsolve(matrix(QQ, {gram}))
  examples: ["x^2 - 3*y^2 + 5*z^2 - 7*w^2 = 0"]
  references: ["Simon, Math. Comp. 2005", "Cassels, Rational Quadratic Forms"]

- slug: legendre
  name: Legendre equation (diagonal ternary quadratic)
  priority: 1
  status: algorithmic
  class: quadratic
  form: "a*x^2 + b*y^2 + c*z^2 = 0"
  parents: [quadratic-form-zero, diagonal-form]
  matcher: true
  methods: [Legendre criterion, Holzer bounds, conic parametrization]
  software:
    sage: "Conic([a,b,c]).has_rational_point(point=True)"
    pari: "qfsolve"
    magma: "HasRationalPoint"
  code:
    sage: "Conic(QQ, [{a}, {b}, {c}]).rational_point()"
  examples: ["x^2 + y^2 = 2*z^2"]
  references: ["Cremona-Rusin, Math. Comp. 2003"]

- slug: pythagorean
  name: Pythagorean triples
  priority: 1
  status: solved
  class: quadratic
  form: "x^2 + y^2 = z^2"
  parents: [legendre]
  matcher: true
  methods: [Euclid parametrization]
  notes: "Primitive solutions (m^2-n^2, 2mn, m^2+n^2), gcd(m,n)=1, m != n mod 2."
  examples: ["x^2 + y^2 = z^2"]
  references: ["Euclid; Dickson History II ch. IV"]

- slug: quadratic-form-representation
  name: Representation by a quadratic form (k >= 3)
  priority: 1
  status: algorithmic
  class: quadratic
  form: "Q(x_1,...,x_k) = n"
  parents: [quadric]
  matcher: true
  methods: [spinor genus, reduction to isotropy in k+1 variables]
  software:
    sage: "QuadraticForm; qfsolve on Q + <-n>"
    pari: "qfminim, qfsolve"
  references: ["Cassels", "Bhargava 2000 (15-theorem)", "Bhargava-Hanke (290)"]

- slug: sum-of-three-squares
  name: Sum of three squares
  priority: 1
  status: solved
  class: quadratic
  form: "x^2 + y^2 + z^2 = n"
  parents: [quadratic-form-representation]
  matcher: true
  methods: [Legendre-Gauss criterion (n != 4^a(8b+7)), Rabin-Shallit]
  software:
    sage: "three_squares(n)"
  code:
    sage: "three_squares({n})"
  references: ["Rabin-Shallit 1986"]

- slug: sum-of-four-squares
  name: Sum of four squares (Lagrange)
  priority: 1
  status: solved
  class: quadratic
  form: "x^2 + y^2 + z^2 + w^2 = n"
  parents: [quadratic-form-representation]
  matcher: true
  methods: [always solvable (Lagrange 1770), Rabin-Shallit]
  software:
    sage: "four_squares(n)"
  code:
    sage: "four_squares({n})"
  references: ["Lagrange 1770", "Jacobi 1834"]

- slug: congruent-number
  name: Congruent number problem
  priority: 2
  status: partial
  class: quadratic
  form: "x^2 + y^2 = z^2, x*y = 2*n"
  parents: []
  matcher: false   # system; wave 2
  methods: [equivalence with rank of y^2 = x^3 - n^2 x, Tunnell criterion (BSD)]
  software:
    sage: "EllipticCurve([0,0,0,-n^2,0]).rank()"
  references: ["Tunnell 1983", "Koblitz"]

# ---------------------------------------------------------------- cubic / genus 1

- slug: elliptic-weierstrass
  name: Elliptic curve in Weierstrass form
  priority: 1
  status: algorithmic
  class: genus1
  form: "y^2 + a1*x*y + a3*y = x^3 + a2*x^2 + a4*x + a6"
  parents: [genus-one-curve]
  matcher: true
  lmfdb: ec.q
  methods: [Mordell-Weil descent, elliptic logarithms for integral points]
  software:
    sage: "EllipticCurve(...).gens(); .integral_points(); .S_integral_points()"
    pari: "ellrank, ellratpoints"
    magma: "MordellWeilShaInformation; IntegralPoints"
  code:
    sage: |
      E = EllipticCurve({ainvs})
      E.gens(); E.integral_points(both_signs=True)
    magma: |
      E := EllipticCurve({magma_ainvs});
      IntegralPoints(E);
  examples: ["y^2 + y = x^3 - x^2 - 10*x - 20"]
  references: ["Cremona, Algorithms for Modular Elliptic Curves", "Stroeker-Tzanakis 1994"]

- slug: mordell
  name: Mordell equation
  priority: 1
  status: algorithmic
  class: genus1
  form: "y^2 = x^3 + k"
  parents: [elliptic-weierstrass]
  matcher: true
  lmfdb: ec.q
  methods: [elliptic logarithms, tabulated for |k| <= 10^7]
  software:
    sage: "EllipticCurve([0,0,0,0,k]).integral_points()"
  code:
    sage: "EllipticCurve([0, 0, 0, 0, {k}]).integral_points(both_signs=True)"
  examples: ["y^2 = x^3 - 2"]
  references: ["Gebel-Petho-Zimmer 1998", "Bennett-Ghadermarzi 2015"]

- slug: elliptic-quartic
  name: Genus-one quartic
  priority: 1
  status: algorithmic
  class: genus1
  form: "y^2 = q(x), deg q = 4"
  parents: [genus-one-curve]
  matcher: true
  methods: [2-covering to Jacobian, invariant theory (I, J), elliptic logs]
  software:
    magma: "IntegralQuarticPoints([a4,...,a0])"
    sage: "Jacobian of genus-one models"
  code:
    magma: "IntegralQuarticPoints({qcoeffs});"
  examples: ["y^2 = x^4 + 3*x + 1"]
  references: ["Tzanakis, Elliptic Diophantine Equations 2013", "Cremona-Stoll 2002"]

- slug: plane-cubic
  name: Plane cubic curve (ternary cubic)
  priority: 2
  status: algorithmic
  class: genus1
  form: "C(x, y, z) = 0 homogeneous cubic"
  parents: [genus-one-curve]
  matcher: true
  lmfdb: ec.q
  methods: [point search, Nagell reduction to Weierstrass form, descent on torsors]
  software:
    sage: "EllipticCurve_from_cubic; Curve.rational_points(bound)"
    magma: "MinimalModel; ThreeDescent"
  notes: "May fail the Hasse principle (Selmer: 3x^3 + 4y^3 + 5z^3 = 0)."
  references: ["Nagell 1928", "Selmer 1951"]

- slug: sum-of-three-cubes
  name: Sums of three cubes
  priority: 1
  status: open
  class: surface
  form: "x^3 + y^3 + z^3 = n"
  parents: [diagonal-form, cubic-surface]
  matcher: true
  methods: [lattice searches (Elkies), Booker's algorithm; no finiteness theory]
  notes: "Conjecturally solvable for all n != +-4 mod 9 (Heath-Brown); n = 33, 42 resolved 2019."
  examples: ["x^3 + y^3 + z^3 = 42"]
  references: ["Heath-Brown 1992", "Booker-Sutherland 2019"]

- slug: cubic-surface
  name: Cubic surfaces / del Pezzo
  priority: 3
  status: open
  class: surface
  form: "F(x, y, z, w) = 0 cubic"
  parents: [general-polynomial]
  matcher: false
  methods: [Brauer-Manin obstructions, unirationality]
  references: ["Colliot-Thelene-Kanevsky-Sansuc", "Poonen, Rational Points on Varieties"]

- slug: taxicab
  name: Equal sums of two cubes
  priority: 3
  status: partial
  class: surface
  form: "x^3 + y^3 = z^3 + w^3"
  parents: [equal-sums-like-powers]
  matcher: false
  references: ["Silverman, Monthly 1993"]

# ---------------------------------------------------------------- curves

- slug: general-curve
  name: Points on a general curve
  priority: 1
  status: ineffective
  class: curve
  form: "C(x, y) = 0 irreducible, genus g >= 2"
  parents: [general-polynomial]
  matcher: true
  methods: [Chabauty-Coleman, Mordell-Weil sieve, quadratic Chabauty; Faltings for finiteness]
  software:
    magma: "Chabauty; MordellWeilSieve; PointSearch"
    sage: "Curve(...).genus(); rational_points(bound)"
    pari: "hyperellratpoints"
  references: ["Faltings 1983", "Stoll, Rational points on curves (2011)"]

- slug: genus-zero-curve
  name: Genus 0 curve
  priority: 1
  status: algorithmic
  class: curve
  form: "C(x, y) = 0 irreducible of genus 0"
  parents: [general-curve]
  matcher: true
  methods: [conic reduction, parametrization, Pell-type analysis of integral points]
  software:
    sage: "Conic; Curve.parametrization"
    magma: "Parametrization"
  references: ["Poulakis 2002", "Alvanos-Poulakis 2011"]

- slug: genus-one-curve
  name: Genus 1 curve (general model)
  priority: 1
  status: algorithmic
  class: curve
  form: "C(x, y) = 0 irreducible of genus 1"
  parents: [general-curve]
  matcher: true
  methods: [point search, Nagell/Riemann-Roch reduction to Weierstrass, descent]
  software:
    magma: "EllipticCurve(C, pt)"
    pari: "hyperellratpoints (hyperelliptic models)"
  references: ["Nagell 1928", "Poonen 2002 survey"]

- slug: binary-form
  name: Binary form equation
  priority: 1
  status: algorithmic
  class: curve
  form: "F(x, y) = m, F homogeneous of degree >= 3"
  parents: [general-curve, decomposable-form]
  matcher: true    # umbrella; emitted directly for parametric forms
  methods: [GL_2(ZZ) reduction (Julia, Cremona-Stoll), then Thue/divisor methods]
  references: ["Evertse-Gyory, Unit Equations", "Cremona-Stoll 2003"]

- slug: binary-form-reducible
  name: Reducible binary form equation
  priority: 1
  status: solved
  class: curve
  form: "F(x, y) = m, F reducible over QQ"
  parents: [binary-form]
  matcher: true
  methods: [factor and enumerate divisors of m]
  examples: ["x^3 + y^3 = 1729"]

- slug: thue
  name: Thue equation
  priority: 1
  status: algorithmic
  class: curve
  form: "F(x, y) = m, F irreducible of degree >= 3"
  parents: [binary-form]
  matcher: true
  methods: [Baker bounds + LLL (Tzanakis-de Weger, Bilu-Hanrot)]
  software:
    pari: "thue(thueinit(f), m)"
    sage: "gp interface to thue"
    magma: "Thue"
  code:
    pari: "thue(thueinit({fx}, 1), {m})"
    magma: "Solutions(Thue(Polynomial({magma_coeffs})), {m});"
  examples: ["x^3 + 2*y^3 = 11"]
  references: ["Thue 1909", "Bilu-Hanrot 1996"]

- slug: thue-mahler
  name: Thue-Mahler equation
  priority: 1
  status: algorithmic
  class: curve
  form: "F(x, y) = m * p_1^N_1 * ... * p_s^N_s"
  parents: [thue]
  matcher: true
  methods: [S-unit reduction (Tzanakis-de Weger), Gherga-Siksek algorithm]
  software:
    magma: "Gherga-Siksek ThueMahler (GitHub)"
  examples: ["x^3 + 2*y^3 = 5^a * 11^b"]
  references: ["Tzanakis-de Weger 1992", "Gherga-Siksek 2022"]

- slug: superelliptic
  name: Superelliptic curve
  priority: 1
  status: effective
  class: curve
  form: "y^m = f(x), m >= 2"
  parents: [general-curve]
  matcher: true
  methods: [Baker's method via Thue equations over number fields]
  examples: ["y^3 = x^4 + 2"]
  references: ["Baker 1969", "Bilu 1995"]

- slug: hyperelliptic
  name: Hyperelliptic curve
  priority: 1
  status: effective
  class: curve
  form: "y^2 = f(x), deg f >= 5"
  parents: [superelliptic]
  matcher: true
  methods: [Baker (integral points), Chabauty-Coleman + MW sieve (rational points)]
  software:
    magma: "IntegralPoints (genus 2); Chabauty"
    pari: "hyperellratpoints"
  code:
    magma: |
      C := HyperellipticCurve(Polynomial({magma_coeffs}));
      J := Jacobian(C); RankBound(J);
  examples: ["y^2 = x^7 + 3"]
  references: ["Baker 1969", "McCallum-Poonen 2012"]

- slug: genus-two
  name: Genus 2 curve
  priority: 1
  status: effective
  class: curve
  form: "y^2 = f(x), deg f in {5, 6}"
  parents: [hyperelliptic]
  matcher: true
  lmfdb: g2c.q
  methods: [Igusa invariants for identification, Chabauty machinery]
  software:
    magma: "full pipeline (Jacobian, RankBound, Chabauty)"
    sage: "HyperellipticCurve; igusa_clebsch_invariants"
  examples: ["y^2 = x^5 - x + 1"]
  references: ["Igusa 1960", "Cassels-Flynn"]

# ---------------------------------------------------------------- fermat-type

- slug: generalized-fermat
  name: Generalized Fermat equation
  priority: 1
  status: partial
  class: fermat
  form: "a*x^p + b*y^q = c*z^r, gcd(x,y,z) = 1"
  parents: [general-polynomial]
  matcher: true
  methods: [spherical parametrizations (chi > 1), elliptic curves (chi = 1), modular method + Darmon-Granville (chi < 1)]
  notes: >
    chi = 1/p + 1/q + 1/r. Beal/Fermat-Catalan conjectures live here; ten known
    sporadic primitive solutions with all exponents >= 2.
  examples: ["x^2 + y^4 = z^3", "x^p + y^q = z^r"]
  references: ["Darmon-Granville 1995", "Beukers 1998", "Bennett-Chen-Dahmen-Yazdani 2015"]

- slug: fermat
  name: Fermat equation
  priority: 1
  status: solved
  class: fermat
  form: "x^n + y^n = z^n, n >= 3"
  parents: [generalized-fermat]
  matcher: true
  methods: [modularity (Wiles)]
  examples: ["x^4 + y^4 = z^4", "x^n + y^n = z^n"]
  references: ["Wiles 1995"]

- slug: catalan
  name: Catalan equation
  priority: 1
  status: solved
  class: expdioph
  form: "x^p - y^q = 1, x, y, p, q >= 2"
  parents: [exponential-diophantine]
  matcher: true
  methods: [cyclotomic fields (Mihailescu)]
  notes: "Only solution 3^2 - 2^3 = 1."
  examples: ["x^p - y^q = 1"]
  references: ["Mihailescu 2004", "Bilu-Bugeaud-Mignotte 2014"]

- slug: pillai
  name: Pillai equation
  priority: 1
  status: effective
  class: expdioph
  form: "a^x - b^y = c (a, b fixed)"
  parents: [exponential-diophantine]
  matcher: true
  methods: [linear forms in logarithms; at most 2 solutions outside known list (Bennett)]
  examples: ["3^m - 2^n = 1", "3^m - 2^n = 5"]
  references: ["Pillai 1936", "Bennett 2001"]

# ---------------------------------------------------------------- polynomial-exponential

- slug: polynomial-exponential
  name: Polynomial-exponential equation
  priority: 2
  status: partial
  class: expdioph
  form: "mixed polynomial and exponential terms"
  parents: []
  matcher: true
  methods: [Baker's method case by case; undecidable in general (DPR 1961)]
  references: ["Shorey-Tijdeman 1986"]

- slug: exponential-diophantine
  name: Purely exponential equation
  priority: 2
  status: partial
  class: expdioph
  form: "c_1*b_1^n_1 + ... + c_k*b_k^n_k = c"
  parents: [polynomial-exponential]
  matcher: true
  methods: [S-unit equations (3 terms), subspace theorem (more terms, ineffective)]
  examples: ["2^a + 3^b = 5^c"]
  references: ["Evertse-Schlickewei-Schmidt 2002"]

- slug: s-unit
  name: S-unit equation
  priority: 2
  status: algorithmic
  class: expdioph
  form: "a*u + b*v = c, u, v S-units"
  parents: [exponential-diophantine]
  matcher: true
  methods: [Baker + LLL (de Weger)]
  software:
    sage: "K.solve_S_unit_equation(S) (number fields)"
  references: ["de Weger 1987", "Alvarado et al. 2019"]

- slug: ramanujan-nagell
  name: Generalized Ramanujan-Nagell equation
  priority: 1
  status: effective
  class: expdioph
  form: "x^2 + d = k*b^n (classical: x^2 + 7 = 2^n)"
  parents: [polynomial-exponential]
  matcher: true
  methods: [hypergeometric method (Beukers), Baker + LLL (Petho-de Weger)]
  notes: "Classical case: n in {3,4,5,7,15}. At most 2 solutions for general d (Beukers)."
  examples: ["x^2 + 7 = 2^n", "x^2 + 11 = 3^n"]
  references: ["Nagell 1948", "Beukers 1981", "de Weger 1989"]

- slug: power-values
  name: Power values of polynomials (Schinzel-Tijdeman)
  priority: 2
  status: effective
  class: expdioph
  form: "f(x) = c*y^n, n unknown"
  parents: [polynomial-exponential]
  matcher: true
  methods: [Schinzel-Tijdeman bound on n, then superelliptic for each n]
  examples: ["x^3 - 4 = y^n"]
  references: ["Schinzel-Tijdeman 1976", "Shorey-Tijdeman 1986"]

- slug: lebesgue-nagell
  name: Lebesgue-Nagell equation
  priority: 1
  status: partial
  class: expdioph
  form: "x^2 + d = y^n"
  parents: [power-values]
  matcher: true
  methods: [Baker + modular method (Bugeaud-Mignotte-Siksek)]
  notes: "Solved completely for 1 <= d <= 100 (BMS 2006); d = 1 Lebesgue 1850."
  examples: ["x^2 + 2 = y^n"]
  references: ["Lebesgue 1850", "Bugeaud-Mignotte-Siksek 2006"]

- slug: nagell-ljunggren
  name: Nagell-Ljunggren equation
  priority: 2
  status: open
  class: expdioph
  form: "(x^n - 1)/(x - 1) = y^q"
  parents: [exponential-diophantine]
  matcher: false
  notes: "Known: (3,5,11,2), (7,4,20,2), (18,3,7,3); conjecturally all."
  references: ["Ljunggren 1943", "Bugeaud-Mignotte 2002"]

- slug: skolem
  name: Zeros of linear recurrences (Skolem problem)
  priority: 2
  status: partial
  class: expdioph
  form: "u_n = 0, u a linear recurrence"
  parents: [exponential-diophantine]
  matcher: false
  notes: "Decidable for order <= 4; open for order >= 5 - a decidability-boundary exhibit."
  references: ["Skolem-Mahler-Lech", "Ouaknine-Worrell 2012", "BLNOPW 2022"]

- slug: recurrence-powers
  name: Perfect powers in recurrence sequences
  priority: 2
  status: effective
  class: expdioph
  form: "u_n = y^p (u fixed recurrence)"
  parents: [polynomial-exponential]
  matcher: false
  notes: "Fibonacci powers: 0, 1, 8, 144 (Bugeaud-Mignotte-Siksek, Annals 2006)."
  references: ["Bugeaud-Mignotte-Siksek 2006"]

- slug: goormaghtigh
  name: Goormaghtigh equation
  priority: 3
  status: open
  class: expdioph
  form: "(x^m - 1)/(x - 1) = (y^n - 1)/(y - 1)"
  parents: [exponential-diophantine]
  matcher: false
  notes: "Known: 31 and 8191; finite effective for fixed bases (Balasubramanian-Shorey)."
  references: ["Balasubramanian-Shorey 1980"]

- slug: brocard
  name: Brocard-Ramanujan equation
  priority: 3
  status: open
  class: special
  form: "n! + 1 = m^2"
  parents: []
  matcher: false
  notes: "Known n in {4,5,7}; finite under abc (Overholt 1993)."
  references: ["Overholt 1993", "Berndt-Galway 2000"]

# ---------------------------------------------------------------- norm/index forms

- slug: decomposable-form
  name: Decomposable form equation
  priority: 2
  status: partial
  class: normform
  form: "F(x_1,...,x_k) = m, F a product of linear forms over QQbar"
  parents: [general-polynomial]
  matcher: false
  methods: [S-unit theory (Evertse-Gyory)]
  references: ["Evertse-Gyory 2015/2017"]

- slug: norm-form
  name: Norm form equation
  priority: 2
  status: partial
  class: normform
  form: "N_{K/QQ}(x_1*w_1 + ... + x_k*w_k) = m"
  parents: [decomposable-form]
  matcher: false
  methods: [Schmidt subspace theorem (finiteness), unit-group orbits (full modules)]
  software:
    pari: "bnfisintnorm"
    magma: "NormEquation"
    sage: "K.elements_of_norm(m)"
  references: ["Schmidt 1971", "Fincke-Pohst 1985"]

- slug: index-form
  name: Index form equation
  priority: 3
  status: partial
  class: normform
  form: "I(x_2,...,x_k) = m"
  parents: [decomposable-form]
  matcher: false
  methods: [Gaal's algorithms (degrees 3-8)]
  references: ["Gyory 1976", "Gaal 2019"]

# ---------------------------------------------------------------- surfaces & special

- slug: markov-hurwitz
  name: Markov / Hurwitz equation
  priority: 2
  status: partial
  class: surface
  form: "x_1^2 + ... + x_k^2 = a * x_1 * ... * x_k"
  parents: [general-polynomial]
  matcher: true
  methods: [Vieta jumping / Markov tree]
  notes: "Uniqueness conjecture (Frobenius 1913) open for Markov numbers."
  examples: ["x^2 + y^2 + z^2 = 3*x*y*z"]
  references: ["Markov 1880", "Aigner 2013"]

- slug: apollonian
  name: Apollonian circle packings
  priority: 3
  status: partial
  class: surface
  form: "(a+b+c+d)^2 = 2*(a^2+b^2+c^2+d^2), thin-orbit structure"
  parents: [quadratic-form-zero]
  matcher: false
  notes: "Local-global conjecture FALSE (Haag-Kertzer-Rickards-Stange, Annals 2024)."
  references: ["Graham-Lagarias-Mallows-Wilks-Yan 2003", "Haag-Kertzer-Rickards-Stange 2024"]

- slug: egyptian-fractions
  name: Unit fraction (Egyptian fraction) equations
  priority: 1
  status: algorithmic
  class: special
  form: "1/x_1 + ... + 1/x_k = a/n"
  parents: [general-polynomial]
  matcher: true
  methods: [branch-and-bound enumeration for fixed parameters]
  examples: ["1/x + 1/y + 1/z = 1"]
  references: ["Graham surveys", "Bloom 2021"]

- slug: erdos-straus
  name: Erdos-Straus equation
  priority: 1
  status: open
  class: special
  form: "4/n = 1/x + 1/y + 1/z"
  parents: [egyptian-fractions]
  matcher: true
  notes: "Conjectured solvable for all n >= 2; verified to 10^17; Sierpinski's 5/n analogue open."
  examples: ["4/n = 1/x + 1/y + 1/z"]
  references: ["Erdos-Straus 1948", "Elsholtz-Tao 2013"]

- slug: waring
  name: Waring-type diagonal representation
  priority: 2
  status: partial
  class: surface
  form: "x_1^k + ... + x_s^k = n"
  parents: [diagonal-form]
  matcher: true
  methods: [circle method (asymptotics), search + local conditions (instances)]
  examples: ["x^4 + y^4 + z^4 + w^4 = n"]
  references: ["Vaughan, The Hardy-Littlewood Method"]

- slug: diagonal-form
  name: Diagonal form equation
  priority: 2
  status: partial
  class: surface
  form: "a_1*x_1^k + ... + a_s*x_s^k = c"
  parents: [general-polynomial]
  matcher: true
  references: ["Davenport-Lewis 1963"]

- slug: equal-sums-like-powers
  name: Equal sums of like powers
  priority: 3
  status: partial
  class: surface
  form: "x_1^k + ... + x_s^k = y_1^k + ... + y_t^k"
  parents: [diagonal-form]
  matcher: true
  notes: "Euler's conjecture false for k = 4 (Elkies 1988) and k = 5 (Lander-Parkin 1966)."
  examples: ["x^4 + y^4 + z^4 = w^4"]
  references: ["Lander-Parkin 1966", "Elkies 1988"]

- slug: prouhet-tarry-escott
  name: Prouhet-Tarry-Escott problem
  priority: 3
  status: open
  class: surface
  form: "sum x_i^j = sum y_i^j for j = 1..k"
  parents: [equal-sums-like-powers]
  matcher: false
  references: ["Borwein-Ingalls 1994"]

- slug: cannonball
  name: Figurate = perfect power equations
  priority: 3
  status: solved
  class: special
  form: "e.g. 1^2 + ... + x^2 = y^2"
  parents: [elliptic-weierstrass]
  matcher: false
  notes: "Cannonball problem: x = 1, 24 only (Watson 1918)."
  references: ["Watson 1918", "Anglin 1990"]
